# CI: unified build interface + secret scan on GitHub's free hosted runners;
# main also publishes the RPM-carrier artifact image to the org registry
# ($KLN_REGISTRY contract, default ghcr.io/<owner>).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # publish the artifact image with the workflow token

env:
  KLN_REGISTRY: ${{ vars.KLN_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install just + nfpm
        run: |
          set -eu
          curl -fsSL -o just.tgz https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf just.tgz just && sudo install -m 0755 just /usr/local/bin/just
          curl -fsSL -o nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_Linux_x86_64.tar.gz
          tar -xzf nfpm.tgz nfpm && sudo install -m 0755 nfpm /usr/local/bin/nfpm
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libglib2.0-bin pkg-config dbus
      - name: just build
        run: just build
      - name: just test
        run: just test
      - name: just package
        run: just package
      - name: Build RPM-carrier OCI artifact image
        # ubuntu-latest preinstalls podman (same assumption as kleinia-installer)
        run: just artifact
      - name: Push artifact image
        env:
          KLN_REGISTRY_USER: ${{ secrets.KLN_REGISTRY_USER }}
          KLN_REGISTRY_PASSWORD: ${{ secrets.KLN_REGISTRY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/push.sh
      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: build-out/*.rpm
          if-no-files-found: error

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -eu
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Secret scan
        run: gitleaks detect --source . --redact
