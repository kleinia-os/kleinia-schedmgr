# /etc/kleinia/schedmgr.conf — Kleinia Sched Manager configuration (GKeyFile)
#
# Group and key names MUST match pm_config_load() in daemon/schedmgr-core.c
# exactly (GKeyFile is case-sensitive). A drift unit test in daemon/
# re-parses this shipped file to catch mismatches early.
# Paths can be overridden at runtime: schedmgrd --config=PATH

[Cpu]
# Default sched_ext scheduler applied by RestoreDefault / on first start
# (empty = do nothing; e.g. "scx_agent"). "none" = kernel default class (EEVDF).
DefaultStrategy =
# Where scx_* scheduler binaries are discovered (colon-separated).
SchedDirs = /usr/bin:/usr/local/bin:/var/usrlocal/bin

[Cache]
# Where cax_* cache-policy loaders are discovered (colon-separated;
# empty result leaves the Cache domain unavailable).
CaxDirs = /usr/bin:/usr/local/bin:/var/usrlocal/bin
# Passed to the loaders as `-w` (ApplyStrategy params may override it).
WatchDir = /var/tmp
# cgroup v2 directory created for the loaders; the kernel requires the
# directory name to start with "cache_ext".
Cgroup = /sys/fs/cgroup/cache_ext_schedmgr
# Default cache policy applied by RestoreDefault / on first start.
DefaultStrategy =

[Io]
# Where iox_* global IO policy loaders are discovered (colon-separated).
# The global domain is Available only when some
# /sys/block/*/queue/scheduler lists the scx_io elevator.
IoxDirs = /usr/bin:/usr/local/bin:/var/usrlocal/bin
# Default elevator applied by StopStrategy/RestoreDefault per device
# (empty = keep whatever the device had before).
DefaultStrategy =
# Comma-separated device-name prefixes to skip.
SkipPrefixes = zram,loop,ram
# Rescan interval for /sys/block enumeration (seconds).
PollIntervalSec = 5

[Io.DeviceDefaults]
# Optional per-device default elevator, one line per device, e.g.:
# vda = mq-deadline
