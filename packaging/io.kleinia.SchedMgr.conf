<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Kleinia Sched Manager DBus policy.

  Read access (introspection, properties) is open to everyone so the GNOME
  Shell extension and the SchedMgr app can display status without prompting.
  State-changing methods are open at the DBus layer but gated by polkit
  action io.kleinia.schedmgr.apply inside the daemon (same model as
  scx_loader / org.scx.Loader).
-->
<busconfig>
  <!-- daemon (running as root) must be allowed to OWN the name; without this
       the Type=dbus unit can never start (found by kleinia VM deep-test). -->
  <policy user="root">
    <allow own="io.kleinia.SchedMgr"/>
  </policy>

  <policy context="default">
    <!-- read-only surface -->
    <allow send_destination="io.kleinia.SchedMgr"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.kleinia.SchedMgr"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="io.kleinia.SchedMgr"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="io.kleinia.SchedMgr"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>

    <!-- all custom interfaces: queries + (polkit-gated) state changes -->
    <allow send_destination="io.kleinia.SchedMgr"
           send_interface="io.kleinia.Manager1"/>
    <allow send_destination="io.kleinia.SchedMgr"
           send_interface="io.kleinia.Sched1"/>
    <allow send_destination="io.kleinia.SchedMgr"
           send_interface="io.kleinia.Io1"/>

    <!-- change signals -->
    <allow receive_sender="io.kleinia.SchedMgr"/>
  </policy>
</busconfig>
