<?xml version="1.0" encoding="UTF-8"?>
<!--
  io.kleinia.SchedMgr-symbolic.svg
  原创自绘 symbolic 图标（Kleinia 调度管理器）：
  意象 = 速度计（策略热切换）+ 底部层叠方块（CPU / 页缓存 / IO 三个策略域）。
  单色 #bebebe，符合 GNOME symbolic 图标惯例。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- 速度计表盘弧 -->
  <path d="M1.8 8A6.2 6.2 0 0 1 14.2 8" fill="none" stroke="#bebebe"
        stroke-width="1.6" stroke-linecap="round"/>
  <!-- 指针 -->
  <path d="M8 8l3.6-3.2" fill="none" stroke="#bebebe"
        stroke-width="1.6" stroke-linecap="round"/>
  <!-- 表盘中心轴点 -->
  <circle cx="8" cy="8" r="1.3" fill="#bebebe"/>
  <!-- 层叠方块（上层两块） -->
  <rect x="1.5" y="10.6" width="6" height="2.4" rx="0.8" fill="#bebebe"/>
  <rect x="8.5" y="10.6" width="6" height="2.4" rx="0.8" fill="#bebebe" opacity="0.55"/>
  <!-- 层叠方块（下层一块） -->
  <rect x="3" y="13.4" width="10" height="1.7" rx="0.8" fill="#bebebe" opacity="0.8"/>
</svg>
